# Lumos主配置样例
log_level: INFO

server:
  host: 127.0.0.1
  port: 8000
  cors_origins: []

provider:
  type: openai_compat
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 4096
  timeout: 60

db:
  url: sqlite+aiosqlite:///./data/lumos.db
  echo: false

tools:
  allowed_paths:
    - ./data/workspace
  shell_enabled: false
  default_timeout: 30

skills:
  dirs:
    - ./skills

mcp_servers:
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./data/workspace"]
    enabled: false

auth:
  jwt_secret: ${JWT_SECRET}
  access_ttl: 86400
  refresh_ttl: 2592000
  bcrypt_rounds: 12
  default_admin_email: admin@example.com
  default_admin_password: ${DEFAULT_ADMIN_PASSWORD}

agent:
  max_steps: 15
  context_compress_threshold: 60000

knowledge_base:
  vector_service_url: "http://localhost:8080"
  database_name: "lumos"
  embed_model: "bge-m3"
  rerank_model: "bge-reranker-v2-m3"
  chunk_size: 500
  chunk_overlap: 75
  search_top_k: 50
  rerank_top_n: 8
  auto_load_models: true
  storage_dir: "./data/knowledge_bases"
  max_file_size_mb: 50
  request_timeout: 300
  allowed_mime_types:
    - "application/pdf"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
    - "text/markdown"
    - "text/plain"
    - "text/html"