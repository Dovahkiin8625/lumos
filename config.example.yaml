# Lumos主配置样例
log_level: INFO

server:
  host: 127.0.0.1
  port: 8000
  cors_origins: []

provider:
  type: openai_compat
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 4096
  timeout: 60

db:
  url: sqlite+aiosqlite:///./data/lumos.db
  echo: false

tools:
  allowed_paths:
    - ./data/workspace
  shell_enabled: false
  default_timeout: 30

skills:
  dirs:
    - ./skills

mcp_servers:
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./data/workspace"]
    enabled: false

auth:
  jwt_secret: ${JWT_SECRET}
  access_ttl: 86400
  refresh_ttl: 2592000
  bcrypt_rounds: 12
  default_admin_email: admin@example.com
  default_admin_password: ${DEFAULT_ADMIN_PASSWORD}

agent:
  max_steps: 15
  context_compress_threshold: 60000